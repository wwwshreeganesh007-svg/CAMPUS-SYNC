{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded shadow mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Secure Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Email Address</label>
            <input type="email" name="email" required class="w-full border p-2 rounded focus:ring-red-500 focus:border-red-500">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
            <input type="password" name="password" required class="w-full border p-2 rounded focus:ring-red-500 focus:border-red-500">
        </div>
        <button type="submit" class="w-full bg-red-700 text-white font-bold py-2 px-4 rounded hover:bg-red-800">Sign In</button>
    </form>
    <div class="mt-4 text-center">
        <a href="{{ url_for('signup') }}" class="text-red-700 text-sm hover:underline">Don't have an account? Sign Up</a>
    </div>
</div>
{% endblock %}
